schema_version: "1.1"
name: melody-in-key
description: 'A melody that follows the set''s Key & Scale.'
tags: [composing, key]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Write an 8-bar melody on a new MIDI track called Lead.
graders:
  - name: lead-track
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:lead-track":\s*true'
  - name: eight-bars
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:eight-bars":\s*true'
  - name: enough-notes
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:enough-notes":\s*true'
  - name: in-d-minor
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:in-d-minor":\s*true'
