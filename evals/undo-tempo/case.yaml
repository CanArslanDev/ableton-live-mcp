schema_version: "1.1"
name: undo-tempo
description: 'Undoes one change and keeps the other.'
tags: [safety]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Mute the Drums track and set the tempo to 90 BPM. Then undo just the tempo change.
graders:
  - name: tempo-back
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:tempo-back":\s*true'
  - name: drums-still-muted
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:drums-still-muted":\s*true'
