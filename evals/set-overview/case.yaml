schema_version: "1.1"
name: set-overview
description: 'Describes the set without changing it.'
tags: [reading]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    What's in my Live set right now? Give me the tempo, the time signature and the tracks,
    with what's on each one.
graders:
  - name: nothing-changed
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:nothing-changed":\s*true'
  - name: tempo-in-answer
    type: regex
    pattern: '\b120\b'
  - name: meter-in-answer
    type: regex
    pattern: '\b4/4\b'
  - name: tracks-in-answer
    type: regex
    pattern: '(?=[\s\S]*\bDrums\b)(?=[\s\S]*\bBass\b)(?=[\s\S]*\bVox\b)'
  - name: clips-in-answer
    type: regex
    flags: i
    pattern: '(?=[\s\S]*bassline)(?=[\s\S]*beat)'
