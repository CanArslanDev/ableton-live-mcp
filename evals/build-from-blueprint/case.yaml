schema_version: "1.1"
name: build-from-blueprint
description: 'Builds a finished reference job''s blueprint into an empty set (needs ABLETON_MCP_PROFILE=full).'
tags: [reference, building]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    The reference song I had analysed earlier is done. Build what it found into this empty
    Live set, then tell me its tempo and which drum sounds it used.
graders:
  - name: tempo-and-meter
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:tempo-and-meter":\s*true'
  - name: tracks
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:tracks":\s*true'
  - name: samples
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:samples":\s*true'
  - name: notes
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:notes":\s*true'
  - name: pad-levels
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:pad-levels":\s*true'
  - name: locators
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:locators":\s*true'
  - name: tempo-in-answer
    type: regex
    pattern: '\b120\b'
  - name: sounds-in-answer
    type: regex
    flags: i
    pattern: '(?=[\s\S]*kick)(?=[\s\S]*snare)(?=[\s\S]*hat)'
