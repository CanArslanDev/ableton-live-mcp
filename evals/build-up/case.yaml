schema_version: "1.1"
name: build-up
description: 'A riser and a filter sweep into a drop.'
tags: [arrangement, transitions, automation]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Build up into the drop at bar 9: a 4-bar riser, and a high-pass filter sweep on the bass
    over those same 4 bars.
graders:
  - name: riser
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:riser":\s*true'
  - name: bass-sweep
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:bass-sweep":\s*true'
  - name: bass-notes-kept
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:bass-notes-kept":\s*true'
