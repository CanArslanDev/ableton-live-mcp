schema_version: "1.1"
name: drum-beat
description: 'Writes a one-bar beat note by note.'
tags: [composing, drums]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Make a one-bar beat on the Drums track: kick on every beat, snare on beats 2 and 4, and a
    closed hi-hat on every eighth note.
graders:
  - name: kick
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:kick":\s*true'
  - name: snare
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:snare":\s*true'
  - name: hats
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:hats":\s*true'
