schema_version: "1.1"
name: tempo-and-meter
description: 'Sets the tempo and an odd meter.'
tags: [session]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Set the tempo to 128 BPM and the time signature to 7/8.
graders:
  - name: tempo
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:tempo":\s*true'
  - name: meter
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:meter":\s*true'
  - name: tracks-untouched
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:tracks-untouched":\s*true'
