schema_version: "1.1"
name: locators
description: 'Named locators at bar positions.'
tags: [arrangement]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Add arrangement locators: Intro at bar 1, Verse at bar 9 and Drop at bar 17.
graders:
  - name: intro
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:intro":\s*true'
  - name: verse
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:verse":\s*true'
  - name: drop
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:drop":\s*true'
