schema_version: "1.1"
name: makam-hicaz
description: 'A melody in makam Hicaz.'
tags: [composing, turkish]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Write a short melody in makam Hicaz on the Bass track, with D as the karar (tonic).
graders:
  - name: melody
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:melody":\s*true'
  - name: hicaz-notes
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:hicaz-notes":\s*true'
  - name: hicaz-third
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:hicaz-third":\s*true'
