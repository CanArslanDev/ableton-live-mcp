schema_version: "1.1"
name: follow-the-notes
description: 'Finds an earlier decision in the set''s notes and applies it.'
tags: [memory, mixing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Set the vocal level the way we agreed last time.
graders:
  - name: vox-level
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:vox-level":\s*true'
  - name: vox-center
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:vox-center":\s*true'
