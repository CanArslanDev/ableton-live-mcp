schema_version: "1.1"
name: transpose-clip
description: 'Transposes an existing clip.'
tags: [editing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Transpose the bass riff up a perfect fifth.
graders:
  - name: up-a-fifth
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:up-a-fifth":\s*true'
