schema_version: "1.1"
name: bass-follows-chords
description: 'A bassline under existing chords.'
tags: [composing, harmony]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    There's a chord progression in the clip on the Keys track. Write a bassline on the Bass
    track that follows it.
graders:
  - name: bassline
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:bassline":\s*true'
  - name: follows-roots
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:follows-roots":\s*true'
  - name: low-register
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:low-register":\s*true'
