schema_version: "1.1"
name: fade-out
description: 'Track automation on the main track, recorded in time.'
tags: [arrangement, automation, mixing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Fade the whole mix out over the last 4 bars of the song, bars 13 to 16.
graders:
  - name: fades-out
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:fades-out":\s*true'
  - name: rest-untouched
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:rest-untouched":\s*true'
