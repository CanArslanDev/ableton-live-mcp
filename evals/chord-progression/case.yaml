schema_version: "1.1"
name: chord-progression
description: 'Writes a four-chord progression.'
tags: [composing]
runs: 1
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 30
  timeout_seconds: 300
  prompt: |
    Write an Am - F - C - G chord progression on the Bass track in the first clip slot, one
    bar per chord.
graders:
  - name: clip
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:clip":\s*true'
  - name: four-bars
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:four-bars":\s*true'
  - name: chords
    type: regex
    target:
      source: file
      path: checks.json
    pattern: '"check:chords":\s*true'
