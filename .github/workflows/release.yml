name: Release

# Push a tag like v1.8.0 (the version in pyproject.toml) to publish a GitHub
# release with the wheel, the sdist and the Claude Desktop extension.
# PyPI: not yet. "ableton-live-mcp" is taken there; once a name is chosen, add
# a pypa/gh-action-pypi-publish step with trusted publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag matches the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv build
      - run: uv run --frozen python packaging/build_mcpb.py
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/*.mcpb --generate-notes
