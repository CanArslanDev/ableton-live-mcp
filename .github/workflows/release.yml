name: Release

# Push a tag like v1.8.0 (the version in pyproject.toml) to publish a GitHub
# release with the wheel, the sdist and the Claude Desktop extension.
# PyPI: not yet. "ableton-live-mcp" is taken there; once a name is chosen, add
# a pypa/gh-action-pypi-publish step with trusted publishing.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: The tag matches the package version
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv build
      - run: uv run --frozen python packaging/build_mcpb.py
      - name: GitHub release, with the version's section of CHANGELOG.md as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" 'index($0, "## " v) == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz dist/*.mcpb --title "$GITHUB_REF_NAME" "${notes[@]}"
