[project]
name = "ableton-live-mcp"
version = "2.1.2"
description = "Full Ableton Live control for AI assistants over MCP: the whole Live Object Model, music generators and audio analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Can Arslan"},
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"},
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ableton", "ableton-live", "mcp", "model-context-protocol", "claude",
            "music-production", "midi", "mixing", "audio-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
    "mcp>=2.3,<3",
    "mido>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
]

[project.scripts]
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-install-script = "MCP_Server.remote_script_install:main"
ableton-mcp-doctor = "MCP_Server.doctor:main"
ableton-mcp-simulator = "MCP_Server.simulator:main"

[project.urls]
Homepage = "https://github.com/CanArslanDev/ableton-live-mcp"
Issues = "https://github.com/CanArslanDev/ableton-live-mcp/issues"
Changelog = "https://github.com/CanArslanDev/ableton-live-mcp/commits/main"
Upstream = "https://github.com/ahujasid/ableton-mcp"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["MCP_Server*"]

[tool.setuptools.package-data]
"MCP_Server.bundled_ableton_remote_script" = ["AbletonMCP_init.py"]
"MCP_Server" = ["midi_tools/*.js"]

[tool.ruff]
target-version = "py310"
# A byte-identical copy of AbletonMCP_Remote_Script/__init__.py
extend-exclude = ["MCP_Server/bundled_ableton_remote_script"]

[tool.ruff.lint]
# Mistakes, not style: syntax errors, undefined or unused names, bare excepts
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The newer tools register at the bottom, after the server exists
"MCP_Server/server.py" = ["E402"]
# Runs inside Live, where any exception must be swallowed and logged
"AbletonMCP_Remote_Script/__init__.py" = ["E722", "E731"]
