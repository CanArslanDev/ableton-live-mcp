[project]
name = "ableton-live-mcp"
version = "1.7.0"
description = "Full Ableton Live control for AI assistants over MCP: the whole Live Object Model, music generators and audio analysis"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Can Arslan"},
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"},
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.9.0,<2.0.0",
    "mido>=1.3",
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "supabase>=2.0.0",
]

[project.scripts]
ableton-mcp = "MCP_Server.server:main"
ableton-mcp-install-script = "MCP_Server.remote_script_install:main"
ableton-mcp-doctor = "MCP_Server.doctor:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["MCP_Server", "MCP_Server.dataset", "MCP_Server.bundled_ableton_remote_script"]
# MANIFEST.in governs the sdist; this governs the wheel. Both are needed.
exclude-package-data = { "MCP_Server" = ["config.py"] }

[tool.setuptools.package-data]
"MCP_Server.bundled_ableton_remote_script" = ["AbletonMCP_init.py"]

[project.urls]
"Homepage" = "https://github.com/CanArslanDev/ableton-live-mcp"
"Bug Tracker" = "https://github.com/CanArslanDev/ableton-live-mcp/issues"
"Upstream" = "https://github.com/ahujasid/ableton-mcp"
